server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # static: long cache, immutable
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — mọi path không phải file đều về index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # deploy check
  location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
